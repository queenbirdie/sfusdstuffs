name: Refresh tours and publish site

on:
  schedule:
    - cron: "0 14 * * *"   # ~6-7am Pacific
    - cron: "0 1 * * *"    # ~5-6pm Pacific
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/index.html", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-and-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh tour data
        if: github.event_name != 'push'
        run: python scripts/refresh_tours.py

      - name: Save data to repo (keeps history of full tours)
        if: github.event_name != 'push'
        run: |
          git config user.name "tour-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --staged --quiet || git commit -m "Refresh tours $(date -u +'%Y-%m-%d %H:%M')"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
